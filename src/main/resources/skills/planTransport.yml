# Generated by scripts/generate-skill-manifests.py
name: "planTransport"
description: "Select relevant rail and/or air catalog searches and preserve all eligible service IDs for whole-trip evaluation."
model: "planner"
planning_mode: true
concurrency: true
max_steps: 4
allowed_skills:
  -
    name: "searchRailServices"
    max_tasks: 1
  -
    name: "searchFlightServices"
    max_tasks: 1
prompt: |
  Read request.allowedModes. Search EACH allowed mode exactly once: rail uses searchRailServices, flight uses searchFlightServices. Never search a disallowed mode.
  When both modes are allowed, group their independent searches in a parallelGroup. For rail-only or flight-only, plan only the applicable search.
  Each Java search takes only assessmentId, copied unchanged. Forward no scenario key or rewritten requirements.
  Merge all returned outbound IDs into outboundServiceIds and all return IDs into returnServiceIds without duplicates. Do not prune by fare, arrival time, or personal preference: downstream hotel transfers and check-in determine whole-trip feasibility.
  Preserve empty lists when inventory is empty. Describe relevant mode tradeoffs briefly; do not invent facts.
input_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    request:
      type: "object"
      properties:
        origin:
          type: "string"
        destination:
          type: "string"
        outboundDate:
          type: "string"
        returnDate:
          type: "string"
        hotelReadyBy:
          type: "string"
        leaveHotelNoEarlierThan:
          type: "string"
        returnToOriginBy:
          type: "string"
        partySize:
          type: "integer"
        rooms:
          type: "integer"
        budgetCents:
          type: "integer"
        allowedModes:
          type: "array"
          items:
            type: "string"
            enum:
              - "rail"
              - "flight"
        priorities:
          type: "array"
          items:
            type: "string"
            enum:
              - "QUIET_ROOM"
              - "SHORT_TRANSFERS"
              - "LOWEST_TOTAL"
      required:
        - "origin"
        - "destination"
        - "outboundDate"
        - "returnDate"
        - "hotelReadyBy"
        - "leaveHotelNoEarlierThan"
        - "returnToOriginBy"
        - "partySize"
        - "rooms"
        - "budgetCents"
        - "allowedModes"
        - "priorities"
      additionalProperties: false
  required:
    - "assessmentId"
    - "request"
  additionalProperties: false
output_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    outboundServiceIds:
      type: "array"
      items:
        type: "string"
      evidence: "searchRailServices or searchFlightServices"
    returnServiceIds:
      type: "array"
      items:
        type: "string"
      evidence: "searchRailServices or searchFlightServices"
    considerations:
      type: "array"
      items:
        type: "string"
      evidence: "searchRailServices or searchFlightServices"
  required:
    - "assessmentId"
    - "outboundServiceIds"
    - "returnServiceIds"
    - "considerations"
  additionalProperties: false
output_schema_max_retries: 2
