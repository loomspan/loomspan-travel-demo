# Generated by scripts/generate-skill-manifests.py
name: "assessTripLogistics"
description: "Evaluate all complete trip candidates, select a preference-based recommendation and meaningful alternative, and return a compact decision to the coordinator."
model: "planner"
allowed_skills:
  -
    name: "evaluateTripOptions"
prompt: |
  Call evaluateTripOptions with the exact assessmentId supplied by your parent. Java loads the completed search results from the assessment record. Missing catalog results or other tool errors are execution failures, never trip infeasibility.
  Java returns the authoritative confirmed request alongside the full evaluation. Read ALL trips, not only the first entries: early entries may be infeasible while later ones are feasible. Use only candidates whose violations array is empty.
  Choose the recommended candidate by the confirmed request.priorities in order: QUIET_ROOM prefers quietRoom=true; SHORT_TRANSFERS prefers lower totalTransferMinutes; LOWEST_TOTAL prefers lower totalCents. Budget and deadlines are hard constraints already checked by Java.
  Offer one distinct meaningful feasible alternative. For a quiet-room recommendation choose the cheapest feasible trip as the budget alternative. For a lowest-price recommendation offer a quiet-room upgrade if affordable. Null is valid when no useful alternative exists. Never invent candidateIds.
  If there are no feasible candidates, return NO_FEASIBLE_TRIP and null choices, explaining the Java global blockers. Money is USD cents for the entire party and stay, not per traveler.
  Return a COMPACT decision, ideally under 900 characters: status and choices first, rationale at most one short sentence per choice, explanation at most two short sentences. Do not echo the full catalog or all rejected options to the planner. The application retains and displays authoritative details. Do not reserve inventory.
  In rationale and explanation use only qualitative traveler-facing language. The application displays all exact amounts, savings, times and counts. Do not include any digits, currency symbols, numerical comparisons (even spelled out), priority enum names, tool names or inventory IDs in prose. Say 'less expensive', 'quiet room' or 'shorter transfers' instead. This prose rule does not apply to exact candidateId fields.
input_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
  required:
    - "assessmentId"
  additionalProperties: false
output_schema:
  type: "object"
  properties:
    status:
      type: "string"
      enum:
        - "OPTIONS"
        - "NO_FEASIBLE_TRIP"
      evidence: "evaluateTripOptions"
    recommended:
      type: "object"
      properties:
        candidateId:
          type: "string"
          description: "Exact candidateId from evaluated Java trip options; never invent or modify it."
        rationale:
          type: "string"
      required:
        - "candidateId"
        - "rationale"
      additionalProperties: false
      nullable: true
      evidence: "evaluateTripOptions"
    alternative:
      type: "object"
      properties:
        candidateId:
          type: "string"
          description: "Exact candidateId from evaluated Java trip options; never invent or modify it."
        rationale:
          type: "string"
      required:
        - "candidateId"
        - "rationale"
      additionalProperties: false
      nullable: true
      evidence: "evaluateTripOptions"
    explanation:
      type: "string"
      evidence: "evaluateTripOptions"
  required:
    - "status"
    - "recommended"
    - "alternative"
    - "explanation"
  additionalProperties: false
output_schema_max_retries: 2
