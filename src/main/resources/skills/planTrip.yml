# Generated by scripts/generate-skill-manifests.py
name: "planTrip"
description: "Coordinate transport, stay and local logistics specialists to recommend a validated complete trip and one meaningful alternative."
model: "planner"
planning_mode: true
concurrency: true
max_steps: 6
allowed_skills:
  -
    name: "planTransport"
    required: true
    max_tasks: 1
  -
    name: "assessStay"
    required: true
    max_tasks: 1
  -
    name: "assessTripLogistics"
    required: true
    max_tasks: 1
prompt: |
  Plan one immutable saved trip assessment. The assessmentId is an application-owned lookup key: pass it exactly unchanged to every specialist.
  Use exactly these tasks: planTransport and assessStay independently, grouped together with the same parallelGroup; then assessTripLogistics depending on both.
  Pass assessmentId and the full original request to transport and stay. After both finish, pass only assessmentId to logistics. The Java searches persist immutable catalog results keyed by that assessment; logistics consumes those exact results without copying inventory IDs through the model.
  Do not call Java grandchildren directly. Do not skip logistics when a catalog is empty; it establishes the blockers.
  The logistics specialist evaluates all combinations and returns a compact preference-based recommendation and alternative. Preserve its exact candidateIds and status in your final result; synthesize its short explanation without inventing options.
  If logistics returns NO_FEASIBLE_TRIP, use null choices and explain its verified blockers. Otherwise return OPTIONS with its recommended and optional alternative choice. Do not override the saved hard budget or deadlines.
  Explain tradeoffs with the actual facts, not fabricated scores. No booking or inventory writes occur during this assessment.
  In rationale and explanation use only qualitative traveler-facing language. The application displays all exact amounts, savings, times and counts. Do not include any digits, currency symbols, numerical comparisons (even spelled out), priority enum names, tool names or inventory IDs in prose. Say 'less expensive', 'quiet room' or 'shorter transfers' instead. This prose rule is separate from exact candidateId and assessmentId fields.
input_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    request:
      type: "object"
      properties:
        origin:
          type: "string"
        destination:
          type: "string"
        outboundDate:
          type: "string"
        returnDate:
          type: "string"
        hotelReadyBy:
          type: "string"
        leaveHotelNoEarlierThan:
          type: "string"
        returnToOriginBy:
          type: "string"
        partySize:
          type: "integer"
        rooms:
          type: "integer"
        budgetCents:
          type: "integer"
        allowedModes:
          type: "array"
          items:
            type: "string"
            enum:
              - "rail"
              - "flight"
        priorities:
          type: "array"
          items:
            type: "string"
            enum:
              - "QUIET_ROOM"
              - "SHORT_TRANSFERS"
              - "LOWEST_TOTAL"
      required:
        - "origin"
        - "destination"
        - "outboundDate"
        - "returnDate"
        - "hotelReadyBy"
        - "leaveHotelNoEarlierThan"
        - "returnToOriginBy"
        - "partySize"
        - "rooms"
        - "budgetCents"
        - "allowedModes"
        - "priorities"
      additionalProperties: false
  required:
    - "assessmentId"
    - "request"
  additionalProperties: false
output_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    status:
      type: "string"
      enum:
        - "OPTIONS"
        - "NO_FEASIBLE_TRIP"
      evidence: "planTransport and assessStay and assessTripLogistics"
    recommended:
      type: "object"
      properties:
        candidateId:
          type: "string"
          description: "Exact candidateId from evaluated Java trip options; never invent or modify it."
        rationale:
          type: "string"
      required:
        - "candidateId"
        - "rationale"
      additionalProperties: false
      nullable: true
      evidence: "planTransport and assessStay and assessTripLogistics"
    alternative:
      type: "object"
      properties:
        candidateId:
          type: "string"
          description: "Exact candidateId from evaluated Java trip options; never invent or modify it."
        rationale:
          type: "string"
      required:
        - "candidateId"
        - "rationale"
      additionalProperties: false
      nullable: true
      evidence: "planTransport and assessStay and assessTripLogistics"
    explanation:
      type: "string"
      evidence: "planTransport and assessStay and assessTripLogistics"
  required:
    - "assessmentId"
    - "status"
    - "recommended"
    - "alternative"
    - "explanation"
  additionalProperties: false
output_schema_max_retries: 2
