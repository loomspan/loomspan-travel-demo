# Generated by scripts/generate-skill-manifests.py
name: "assessStay"
description: "Investigate eligible rooms and quiet-room versus price tradeoffs, preserving the complete hotel catalog for logistics."
model: "planner"
allowed_skills:
  -
    name: "searchHotels"
prompt: |
  Call searchHotels with the exact assessmentId. Retain EVERY returned hotel ID in hotelIds, without duplicates. Do not independently select just the cheapest room: transfer costs may reverse its price advantage, and quiet-room preference matters.
  Use request.priorities to describe room tradeoffs. Quiet-room guarantees must come from Java catalog data. No loyalty capability exists in this slice. Return an empty hotelIds array if no room is available.
input_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    request:
      type: "object"
      properties:
        origin:
          type: "string"
        destination:
          type: "string"
        outboundDate:
          type: "string"
        returnDate:
          type: "string"
        hotelReadyBy:
          type: "string"
        leaveHotelNoEarlierThan:
          type: "string"
        returnToOriginBy:
          type: "string"
        partySize:
          type: "integer"
        rooms:
          type: "integer"
        budgetCents:
          type: "integer"
        allowedModes:
          type: "array"
          items:
            type: "string"
            enum:
              - "rail"
              - "flight"
        priorities:
          type: "array"
          items:
            type: "string"
            enum:
              - "QUIET_ROOM"
              - "SHORT_TRANSFERS"
              - "LOWEST_TOTAL"
      required:
        - "origin"
        - "destination"
        - "outboundDate"
        - "returnDate"
        - "hotelReadyBy"
        - "leaveHotelNoEarlierThan"
        - "returnToOriginBy"
        - "partySize"
        - "rooms"
        - "budgetCents"
        - "allowedModes"
        - "priorities"
      additionalProperties: false
  required:
    - "assessmentId"
    - "request"
  additionalProperties: false
output_schema:
  type: "object"
  properties:
    assessmentId:
      type: "string"
    hotelIds:
      type: "array"
      items:
        type: "string"
      evidence: "searchHotels"
    considerations:
      type: "array"
      items:
        type: "string"
      evidence: "searchHotels"
  required:
    - "assessmentId"
    - "hotelIds"
    - "considerations"
  additionalProperties: false
output_schema_max_retries: 2
